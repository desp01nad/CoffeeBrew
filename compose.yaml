services:
  db-admin:
    image: adminer:5.5.1
    restart: always
    ports:
      - 8080:8080
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - coffee-net

  postgres-db:
    image: postgres:18.6
    restart: always
    shm_size: 128mb
    ports:
      - 5432:5432
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - coffee-data:/var/lib/postgresql
      - ./seed-db.sql:/docker-entrypoint-initdb.d/seed-db.sql
    networks:
      - coffee-net

  # API 1: Using the ready-made image (svenwal)
  images-api:
    image: svenwal/jsonplaceholder:1.1
    container_name: images-api
    ports:
      - 3000:3000
    volumes:
      - ./REST-APIs/images-svenwal.json:/usr/src/app/db.json  # Overwrite default db.json with custom data
      - ./REST-APIs/menu-images:/usr/src/app/public/menu-images
    networks:
      - coffee-net

  # API 2: Using a custom Dockerfile
  locations-api:
    build:
      context: .
      dockerfile: ./REST-APIs/locations.Dockerfile
    container_name: locations-api
    ports:
      - 3001:3000
    networks:
      - coffee-net

  appsmith:
    image: appsmith/appsmith-ce:v1.95
    container_name: appsmith
    ports:
        - "8000:80"
    volumes:
        - ./stacks:/appsmith-stacks
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - coffee-net

volumes:
  coffee-data:

networks:
  coffee-net: {}
