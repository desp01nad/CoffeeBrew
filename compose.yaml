services:
  db-admin:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - coffee-net

  postgres-db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - coffee-data:/var/lib/postgresql
      - ./seed-db.sql:/docker-entrypoint-initdb.d/seed-db.sql
    networks:
      - coffee-net

  # API 1: Using the ready-made image (svenwal)
  images-api:
    image: svenwal/jsonplaceholder
    container_name: images-api
    ports:
      - 3000:3000
    volumes:
      - ./images-svenwal.json:/usr/src/app/db.json  # Overwrite default db.json with custom data
      - ./menu-images:/usr/src/app/public/menu-images
    networks:
      - coffee-net

  # API 2: Using a custom Dockerfile
  locations-api:
    build: 
      context: .
      dockerfile: ./locations.Dockerfile
    container_name: locations-api
    ports:
      - 3001:3000
    networks:
      - coffee-net

  appsmith:
    image: appsmith/appsmith-ce
    container_name: appsmith
    ports:
        - "80:80"
        - "443:443"
    volumes:
        - ./stacks:/appsmith-stacks
    restart: always
    networks:
      - coffee-net

volumes:
  coffee-data:   

networks:
  coffee-net: {}
  